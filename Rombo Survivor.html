<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rombo Survivor</title>
<style>
:root{color-scheme:dark;--bg:#070914;--fg:#e8ecff;--acc:#5eead4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;overflow:hidden}
body{background:radial-gradient(ellipse at 15% 15%,#1d1b4d 0,transparent 55%),radial-gradient(ellipse at 85% 80%,#34123f 0,transparent 55%),var(--bg)}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;justify-content:space-between;padding:10px 16px;font-weight:600;font-size:14px;gap:8px;pointer-events:none}
</style>
</head>
<body>
<div id="hud"><span id="w"></span><span id="hp"></span><span id="sc"></span></div>
<canvas id="c"></canvas>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H, best = 0;
const M = { x: innerWidth / 2, y: innerHeight / 2 };
function resize() {
  const d = window.devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  cv.width = W * d; cv.height = H * d;
  ctx.setTransform(d, 0, 0, d, 0, 0);
}
addEventListener('resize', resize); resize();

function setPtr(e) { M.x = e.clientX; M.y = e.clientY; }
addEventListener('pointermove', setPtr);
addEventListener('pointerdown', e => {
  setPtr(e);
  if (G.over) { if (G.overT > 0.6) reset(); return; }
});
addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'Escape') {
    e.preventDefault();
    if (G.over) { if (e.code === 'Space' && G.overT > 0.6) reset(); }
    else G.paused = !G.paused;
  }
});
addEventListener('blur', () => { if (!G.over) G.paused = true; });

const BONUS_EVERY = 3;   // cada cuántas oleadas llega un bonus aleatorio
const TYPES = [
  { sides: 4, r: 14, speed: 40, hp: 1, pts: 10, hue: 350 },   // cuadrado
  { sides: 3, r: 12, speed: 76, hp: 1, pts: 15, hue: 45 },   // triángulo rápido
  { sides: 6, r: 24, speed: 26, hp: 4, pts: 40, hue: 265 }    // hexágono tanque
];
const GRAY = '#8b93a1';
// la FORMA es el tipo de enemigo; el COLOR es su vida actual (1 = rosa ... 11+ = blanco)
const HPCOL = ['#fb7185', '#fb923c', '#fbbf24', '#a3e635', '#34d399', '#22d3ee', '#60a5fa', '#a78bfa', '#e879f9', '#f0abfc', '#ffffff'];
const hpCol = hp => HPCOL[Math.min(Math.max(1, Math.ceil(hp)), HPCOL.length) - 1];
const bR = () => Math.min(10, 5 + G.power * 0.5);
const STARS = Array.from({ length: 150 }, () => ({ x: Math.random(), y: Math.random(), z: 0.2 + Math.random() * 0.8,
  tw: 1 + Math.random() * 3, c: ['#ffffff', '#ffffff', '#bcd0ff', '#ffe9c4'][Math.floor(Math.random() * 4)] }));
const POW = [
  { id: 'nova', n: 'Nova', g: '◎', col: '#f472b6', w: 3 },
  { id: 'prism', n: 'Prisma', g: '▲', col: '#fbbf24', w: 3 },
  { id: 'laser', n: 'Láser', g: '━', col: '#f87171', w: 3 },
  { id: 'sats', n: 'Satélites', g: '✦', col: '#a3e635', w: 3 },
  { id: 'shield', n: 'Escudo', g: '⬡', col: '#60a5fa', w: 3 },
  { id: 'life', n: 'Vida extra', g: '♥', col: '#fb7185', w: 1 },
  { id: 'ghost', n: 'Fantasma', g: '◌', col: '#cbd5e1', w: 3 },
  { id: 'magnet', n: 'Imán', g: '∩', col: '#facc15', w: 3 },
  { id: 'freeze', n: 'Congelación', g: '❄', col: '#7dd3fc', w: 3 },
  { id: 'hole', n: 'Agujero negro', g: '●', col: '#c084fc', w: 3 },
  { id: 'frenzy', n: 'Frenesí', g: '✸', col: '#fb923c', w: 3 },
  { id: 'mini', n: 'Miniatura', g: '▣', col: '#2dd4bf', w: 3 }
];
const DUR = { laser: 6, ghost: 4.5, magnet: 8, freeze: 5, frenzy: 6, mini: 8 };
let G;
function dmg(e, n) {
  if (e.hp <= 0) return;
  const col = hpCol(e.hp);
  e.hp -= n; e.flash = 0.08;
  if (e.hp <= 0) {
    G.score += e.pts; boom(e.x, e.y, col);
    G.orbs.push({ x: e.x, y: e.y, pts: Math.ceil(e.pts / 2), life: 9 });
    if (e.big && Math.random() < 0.35) addPick(e.x, e.y);
  }
}
function addPick(x, y) {
  let r = Math.random() * POW.reduce((a, p) => a + p.w, 0), P = POW[0];
  for (const p of POW) { if ((r -= p.w) < 0) { P = p; break; } }
  G.picks.push({ x: x === undefined ? 40 + Math.random() * (W - 80) : Math.max(30, Math.min(W - 30, x)),
                 y: y === undefined ? 110 + Math.random() * (H - 150) : Math.max(30, Math.min(H - 30, y)), P, life: 14 });
}
function applyPow(P) {
  const f = G.fx, id = P.id;
  let msg = '¡' + P.n + '!';
  if (id === 'nova') {
    G.rings.push({ x: G.px, y: G.py, r: 0 });
    for (const e of G.enemies) {
      const dx = e.x - G.px, dy = e.y - G.py, d = Math.hypot(dx, dy) || 1;
      if (d < 280) { e.x += dx / d * 150; e.y += dy / d * 150; dmg(e, 3 + G.power * 2); }
    }
  } else if (id === 'prism') { f.prismN = [3, 5, 8][Math.floor(Math.random() * 3)]; f.prism = 8; msg += ' ' + f.prismN + ' direcciones'; }
  else if (id === 'sats') { f.satN = 2 + Math.floor(Math.random() * 2); f.sats = 10; msg += ' x' + f.satN; }
  else if (id === 'shield') { G.shieldN += 2; msg += ' (' + G.shieldN + ' golpes)'; }
  else if (id === 'life') { G.lives++; }
  else if (id === 'hole') G.holes.push({ x: G.px, y: G.py, life: 5 });
  else f[id] = DUR[id];
  toast(msg);
}
function reset() {
  G = { px: W / 2, py: H / 2, aim: -Math.PI / 2, score: 0, wave: 0, left: 0, spawnT: 0,
        pause: 1, fireT: 0, bullets: [], enemies: [], parts: [], trail: [],
        power: 1, shots: 1, pierce: 1, speed: 260, paused: false, over: false,
        lives: 0, shieldN: 0, inv: 0, tt: 0, picks: [], orbs: [], holes: [], rings: [],
        fx: { prism: 0, prismN: 3, laser: 0, sats: 0, satN: 2, ghost: 0, magnet: 0, freeze: 0, frenzy: 0, mini: 0 },
        overT: 0, msgs: [], elite: false };
  M.x = W / 2; M.y = H / 2 - 80;
}
reset();

function toast(t) { G.msgs.push({ t, life: 2.6 }); }
function nextWave() {
  const w = ++G.wave;
  G.elite = w % 5 === 0;
  G.left = G.elite ? 4 + w : 5 + w * 2;
  G.spawnT = 0;
  toast(G.elite ? '¡Oleada ' + w + '! Figuras gigantes' : 'Oleada ' + w);
  if (G.elite) { for (let i = 0; i < 3; i++) addPick(); toast('¡Powerups en el campo!'); }
  if (w % 2 === 0) { G.power++; toast('¡Poder de disparo +1!'); }
  if (w % 4 === 0) { G.speed += 35; toast('¡Velocidad de movimiento +!'); }
  if (w % BONUS_EVERY === 0) {
    if (Math.random() < 0.5) { G.pierce++; toast('¡Bonus: Perforante! Atraviesa ' + G.pierce + ' enemigos'); }
    else { G.shots++; toast('¡Bonus: Ráfaga! ' + G.shots + ' proyectiles'); }
  }
}
function spawn() {
  const w = G.wave, r = Math.random();
  let k = 0;
  if (w >= 2 && r < 0.3) k = 1;        // triángulo: desde la oleada 2
  if (w >= 4 && r > 0.85) k = 2;       // hexágono: desde la oleada 4
  const T = TYPES[k], size = G.elite ? 1.7 : 1;
  const hp = Math.ceil((T.hp + Math.floor(w / 3)) * (G.elite ? 2.5 : 1));
  const sp = T.speed * (1 + w * 0.02) * (G.elite ? 0.8 : 1);
  const R = T.r * size, a = Math.random() * 6.283, d = Math.hypot(W, H) / 2 + R + 30;
  G.enemies.push({ x: W / 2 + Math.cos(a) * d, y: H / 2 + Math.sin(a) * d, r: R, sides: T.sides, hp,
    sp, rot: 0, flash: 0, sc: 0, big: G.elite, pts: Math.round(T.pts * size * (G.elite ? 2 : 1)) });
}
function boom(x, y, col, n) {
  for (let i = 0; i < (n || 8); i++) {
    const a = Math.random() * 6.28, s = 60 + Math.random() * 160;
    G.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.6, col });
  }
}
function update(dt) {
  const f = G.fx; G.tt += dt; G.inv -= dt;
  for (const k in f) if (k !== 'prismN' && k !== 'satN' && f[k] > 0) f[k] -= dt;
  // movimiento: el rombo sigue al mouse y mira hacia él
  const dx = M.x - G.px, dy = M.y - G.py, d = Math.hypot(dx, dy);
  if (d > 4) {
    G.aim = Math.atan2(dy, dx);
    const s = Math.min(1, d / 80) * G.speed * (f.frenzy > 0 ? 1.5 : 1);
    G.px += dx / d * s * dt; G.py += dy / d * s * dt;
  }
  G.px = Math.max(14, Math.min(W - 14, G.px));
  G.py = Math.max(14, Math.min(H - 14, G.py));
  G.trail.push({ x: G.px, y: G.py, life: 0.45 });
  for (const t of G.trail) t.life -= dt;
  G.trail = G.trail.filter(t => t.life > 0);
  for (const m of G.msgs) m.life -= dt;
  G.msgs = G.msgs.filter(m => m.life > 0);

  // oleadas sin parar: la siguiente empieza cuando terminan de salir las figuras
  if (G.left === 0) {
    G.pause -= dt;
    if (G.pause <= 0) { nextWave(); G.pause = 0.8; }
  }
  if (G.left > 0) {
    G.spawnT -= dt;
    if (G.spawnT <= 0) { spawn(); G.left--; G.spawnT = Math.max(0.2, 0.7 - G.wave * 0.03); }
  }

  // disparo siempre hacia el frente
  G.fireT -= dt * (f.frenzy > 0 ? 2.5 : 1);
  if (G.fireT <= 0) {
    const L = f.laser > 0, n = f.prism > 0 ? f.prismN : G.shots, sp = L ? 950 : 540;
    for (let i = 0; i < n; i++) {
      const a = f.prism > 0 ? G.aim + i * 6.283 / n : G.aim + (i - (n - 1) / 2) * 0.16;
      G.bullets.push({ x: G.px + Math.cos(G.aim) * 20, y: G.py + Math.sin(G.aim) * 20,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1.4, pierce: L ? 99 : G.pierce, laser: L, hit: new Set() });
    }
    G.fireT = Math.max(0.14, 0.4 - G.wave * 0.01);
  }
  for (const b of G.bullets) { b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt; }
  const br = bR();

  const hr = f.mini > 0 ? 5.5 : 11, slow = f.freeze > 0 ? 0.35 : 1;
  for (const e of G.enemies) {
    if (e.hp <= 0) continue;
    const a = Math.atan2(G.py - e.y, G.px - e.x);
    e.x += Math.cos(a) * e.sp * slow * dt; e.y += Math.sin(a) * e.sp * slow * dt;
    e.rot += dt * 2; e.flash -= dt; e.sc -= dt;
    for (const h of G.holes) {
      const hx = h.x - e.x, hy = h.y - e.y, hd = Math.hypot(hx, hy) || 1;
      if (hd < 320) { const v = (60 + 180 * (1 - hd / 320)) * dt; e.x += hx / hd * v; e.y += hy / hd * v; }
      if (hd < 22) dmg(e, 5 * dt);
    }
    if (f.sats > 0 && e.sc <= 0) for (let i = 0; i < f.satN; i++) {
      const sa = G.tt * 3 + i * 6.283 / f.satN;
      if (Math.hypot(G.px + Math.cos(sa) * 48 - e.x, G.py + Math.sin(sa) * 48 - e.y) < e.r + 7) { dmg(e, G.power); e.sc = 0.35; break; }
    }
    if (e.hp > 0 && f.ghost <= 0 && G.inv <= 0 && Math.hypot(G.px - e.x, G.py - e.y) < e.r + hr) {
      if (G.shieldN > 0) { G.shieldN--; G.inv = 0.8; dmg(e, 999); }
      else if (G.lives > 0) { G.lives--; G.inv = 1.5; dmg(e, 999); toast('¡Perdiste una vida extra!'); }
      else { G.over = true; best = Math.max(best, G.score); boom(G.px, G.py, '#ffffff', 30); }
    }
  }
  for (const b of G.bullets) {
    for (const e of G.enemies) {
      if (b.life <= 0) break;
      if (e.hp <= 0 || b.hit.has(e)) continue;
      if (Math.hypot(b.x - e.x, b.y - e.y) < e.r + br) {
        b.hit.add(e); dmg(e, G.power);
        if (--b.pierce <= 0) b.life = 0;
      }
    }
  }
  G.bullets = G.bullets.filter(b => b.life > 0);
  G.enemies = G.enemies.filter(e => e.hp > 0);
  const mag = f.magnet > 0;
  for (const o of G.orbs) {
    o.life -= dt;
    const ox = G.px - o.x, oy = G.py - o.y, od = Math.hypot(ox, oy) || 1;
    if (mag || od < 90) { o.x += ox / od * 520 * dt; o.y += oy / od * 520 * dt; }
    if (od < 24) { G.score += o.pts; o.life = 0; }
  }
  G.orbs = G.orbs.filter(o => o.life > 0);
  for (const k of G.picks) {
    k.life -= dt;
    const ox = G.px - k.x, oy = G.py - k.y, od = Math.hypot(ox, oy) || 1;
    if (mag) { k.x += ox / od * 300 * dt; k.y += oy / od * 300 * dt; }
    if (od < 28) { applyPow(k.P); k.life = 0; }
  }
  G.picks = G.picks.filter(k => k.life > 0);
  for (const h of G.holes) h.life -= dt;
  G.holes = G.holes.filter(h => h.life > 0);
  for (const r of G.rings) r.r += 700 * dt;
  G.rings = G.rings.filter(r => r.r < 300);
  for (const p of G.parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
  G.parts = G.parts.filter(p => p.life > 0);
}

function poly(x, y, r, n, rot) {
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const a = rot + i * 6.283 / n;
    ctx[i ? 'lineTo' : 'moveTo'](x + Math.cos(a) * r, y + Math.sin(a) * r);
  }
  ctx.closePath();
}
function overlay(title, sub) {
  ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#e8ecff'; ctx.textAlign = 'center';
  ctx.font = '700 34px system-ui'; ctx.fillText(title, W / 2, H / 2 - 14);
  ctx.font = '17px system-ui';
  sub.forEach((s, i) => ctx.fillText(s, W / 2, H / 2 + 18 + i * 26));
}
function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  if (G.fx.frenzy > 0 && !G.paused) ctx.translate((Math.random() - 0.5) * 6, (Math.random() - 0.5) * 6);
  { // fondo espacial con parallax
    const pr = Math.min(W, H) * 0.14, gx = W * 0.82 - (G.px - W / 2) * 0.02, gy = H * 0.22 - (G.py - H / 2) * 0.02;
    const g = ctx.createRadialGradient(gx - pr * 0.3, gy - pr * 0.3, pr * 0.1, gx, gy, pr);
    g.addColorStop(0, 'rgba(120,110,200,.5)'); g.addColorStop(1, 'rgba(30,25,70,.15)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(gx, gy, pr, 0, 6.283); ctx.fill();
    for (const st of STARS) {
      const x = ((st.x * W - (G.px - W / 2) * st.z * 0.1 - G.tt * st.z * 8) % W + W) % W;
      const y = ((st.y * H - (G.py - H / 2) * st.z * 0.1) % H + H) % H;
      ctx.globalAlpha = (0.35 + 0.65 * st.z) * (0.75 + 0.25 * Math.sin(G.tt * st.tw + st.x * 20));
      ctx.fillStyle = st.c; ctx.fillRect(x, y, st.z * 1.8, st.z * 1.8);
    }
    ctx.globalAlpha = 1;
  }
  // estela
  for (const t of G.trail) {
    const k = t.life / 0.45;
    ctx.globalAlpha = k * 0.35; ctx.fillStyle = '#5eead4';
    ctx.beginPath(); ctx.arc(t.x, t.y, 3 + 8 * k, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;
  for (const h of G.holes) {
    ctx.beginPath(); ctx.arc(h.x, h.y, 20, 0, 6.283); ctx.fillStyle = '#000'; ctx.fill();
    ctx.strokeStyle = '#c084fc'; ctx.lineWidth = 3; ctx.stroke();
  }
  for (const r of G.rings) { ctx.globalAlpha = 1 - r.r / 300; ctx.strokeStyle = '#f472b6'; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, 6.283); ctx.stroke(); }
  ctx.globalAlpha = 1; ctx.fillStyle = '#fde047';
  for (const o of G.orbs) { ctx.beginPath(); ctx.arc(o.x, o.y, 3.5, 0, 6.283); ctx.fill(); }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = '700 18px system-ui';
  for (const k of G.picks) {
    if (k.life < 4 && Math.floor(k.life * 6) % 2) continue;
    ctx.beginPath(); ctx.arc(k.x, k.y, 17 + Math.sin(G.tt * 5) * 2, 0, 6.283);
    ctx.fillStyle = 'rgba(15,18,32,.85)'; ctx.fill();
    ctx.strokeStyle = k.P.col; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = k.P.col; ctx.fillText(k.P.g, k.x, k.y + 1);
  }
  ctx.textBaseline = 'alphabetic'; ctx.lineJoin = 'round';
  for (const e of G.enemies) {
    const c = e.flash > 0 ? '#fff' : hpCol(e.hp);
    if (e.r >= 20) {   // grandes (hexágonos y gigantes): huecas, con borde gris fino por ambos lados
      const k = 1 / Math.cos(Math.PI / e.sides);
      ctx.strokeStyle = c; ctx.lineWidth = 4; poly(e.x, e.y, e.r, e.sides, e.rot); ctx.stroke();
      ctx.strokeStyle = GRAY; ctx.lineWidth = 1.5;
      poly(e.x, e.y, e.r + 3 * k, e.sides, e.rot); ctx.stroke();
      poly(e.x, e.y, e.r - 3 * k, e.sides, e.rot); ctx.stroke();
    } else {
      poly(e.x, e.y, e.r, e.sides, e.rot);
      ctx.fillStyle = c; ctx.fill(); ctx.strokeStyle = GRAY; ctx.lineWidth = 3; ctx.stroke();
    }
  }
  ctx.fillStyle = '#5eead4'; ctx.strokeStyle = '#5eead4'; ctx.lineCap = 'round';
  const br = bR();
  for (const b of G.bullets) {
    if (b.laser) { ctx.lineWidth = br; ctx.beginPath(); ctx.moveTo(b.x - b.vx * 0.06, b.y - b.vy * 0.06); ctx.lineTo(b.x, b.y); ctx.stroke(); }
    else {
      ctx.fillStyle = '#2dd4bf'; ctx.globalAlpha = 0.25;
      ctx.beginPath(); ctx.arc(b.x, b.y, br * 1.6, 0, 6.283); ctx.fill(); ctx.globalAlpha = 1;
      ctx.beginPath(); ctx.arc(b.x, b.y, br, 0, 6.283); ctx.fill();
      ctx.strokeStyle = '#e8ecff'; ctx.lineWidth = Math.max(1.2, br * 0.3);
      const ra = G.tt * 6, L = br * 0.85;
      ctx.beginPath();
      for (let q = 0; q < 3; q++) {
        const a = ra + q * Math.PI / 3;
        ctx.moveTo(b.x - Math.cos(a) * L, b.y - Math.sin(a) * L); ctx.lineTo(b.x + Math.cos(a) * L, b.y + Math.sin(a) * L);
      }
      ctx.stroke(); ctx.strokeStyle = '#5eead4';
    }
  }
  for (const p of G.parts) { ctx.globalAlpha = Math.max(0, p.life * 1.6); ctx.fillStyle = p.col; ctx.fillRect(p.x - 2, p.y - 2, 4, 4); }
  ctx.globalAlpha = 1;
  if (!G.over) {
    const f = G.fx;
    ctx.save(); ctx.translate(G.px, G.py); ctx.rotate(G.aim);
    if (f.mini > 0) ctx.scale(0.5, 0.5);
    if (f.ghost > 0) { ctx.globalAlpha = 0.4; ctx.setLineDash([5, 4]); }
    else if (G.inv > 0) ctx.globalAlpha = 0.5;
    ctx.beginPath(); ctx.moveTo(20, 0); ctx.lineTo(0, 14); ctx.lineTo(-20, 0); ctx.lineTo(0, -14); ctx.closePath();
    ctx.fillStyle = '#e8ecff'; ctx.fill();
    ctx.strokeStyle = '#8b93a1'; ctx.lineWidth = 3; ctx.lineJoin = 'round'; ctx.stroke(); ctx.restore();
    if (G.shieldN > 0) { poly(G.px, G.py, 30, 6, G.tt); ctx.strokeStyle = '#60a5fa'; ctx.lineWidth = 2 + G.shieldN; ctx.stroke(); }
    if (f.sats > 0) for (let i = 0; i < f.satN; i++) {
      const sa = G.tt * 3 + i * 6.283 / f.satN;
      ctx.beginPath(); ctx.arc(G.px + Math.cos(sa) * 48, G.py + Math.sin(sa) * 48, 7, 0, 6.283);
      ctx.fillStyle = '#a3e635'; ctx.fill(); ctx.strokeStyle = GRAY; ctx.lineWidth = 2; ctx.stroke();
    }
  }
  ctx.restore();
  document.getElementById('w').textContent = 'Oleada ' + G.wave;
  document.getElementById('hp').textContent = 'Poder ' + G.power + ' · Proyectiles ' + G.shots + ' · Perfora ' + G.pierce + (G.lives ? ' · ♥' + G.lives : '') + (G.shieldN ? ' · ⬡' + G.shieldN : '');
  if (!G.over) {
    ctx.textAlign = 'left'; ctx.font = '13px system-ui'; let yy = H - 18;
    for (const P of POW) { const t = G.fx[P.id]; if (t > 0) { ctx.fillStyle = P.col; ctx.fillText(P.g + ' ' + P.n + ' ' + Math.ceil(t) + 's', 16, yy); yy -= 18; } }
  }
  document.getElementById('sc').textContent = 'Puntos ' + G.score;
  if (!G.over) {
    ctx.textAlign = 'center'; ctx.font = '700 17px system-ui';
    G.msgs.slice(-4).forEach((m, i) => {
      ctx.globalAlpha = Math.min(1, m.life); ctx.fillStyle = '#e8ecff';
      ctx.fillText(m.t, W / 2, 80 + i * 26);
    });
    ctx.globalAlpha = 1;
  }
  if (G.paused) {
    overlay('Pausa', ['Espacio o Esc para continuar']);
  } else if (G.over) {
    overlay('Te alcanzaron', ['Oleada ' + G.wave + ' · ' + G.score + ' puntos · récord ' + best,
                              'Toca o presiona espacio para reintentar']);
  }
}

let last = performance.now();
(function loop(t) {
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  if (G.over) G.overT += dt;
  else if (!G.paused) update(dt);
  draw();
  requestAnimationFrame(loop);
})(last);
</script>
</body>
</html>
